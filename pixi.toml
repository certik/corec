[workspace]
authors = ["Ondřej Čertík <ondrej@certik.us>"]
channels = [
    "https://prefix.dev/certik-forge",
    "conda-forge",
]
name = "corec"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

#=============================================================================
# WebAssembly (WASI)
#=============================================================================
[feature.wasm.tasks]
build_wasm = { cmd = """
clang \
    --target=wasm32-wasi \
    -Os \
    -nostdlib \
    -nostdinc \
    -fno-builtin \
    -I platform \
    -I . \
    -Wl,--no-entry \
    -Wl,--export=__heap_base \
    -Wl,--export=_start \
    -Wl,--initial-memory=131072 \
    -o corec_test.wasm \
    test_base_only.c \
    test_base.c \
    base/io.c \
    base/buddy.c \
    base/arena.c \
    base/scratch.c \
    base/format.c \
    base/math.c \
    base/string.c \
    base/mem.c \
    base/numconv.c \
    base/assert.c \
    base/exit.c \
    platform/platform_wasm.c
""", inputs = [
    "test_base_only.c", "test_base.c", "test_base.h",
    "base/**/*.c", "base/**/*.h",
    "platform/platform_wasm.c", "platform/platform.h",
], outputs = ["corec_test.wasm"], description = "Build corec_test.wasm (wasm32-wasi target)" }

test_wasm = { cmd = "wasmtime --dir . corec_test.wasm", depends-on = ["build_wasm"], description = "Run corec_test.wasm under wasmtime" }

[feature.wasm.dependencies]
clang = ">=20.1.4,<21"
lld = ">=20.1.4,<21"
wasmtime = ">=38.0.3,<39"

#=============================================================================
# JavaScript host (Node + browser) — runs the same corec_test.wasm
#=============================================================================
[feature.js.tasks]
test_node = { cmd = "node examples/js/run_node.js corec_test.wasm", depends-on = ["build_wasm"], description = "Run corec_test.wasm under Node.js (examples/js/run_node.js)" }
serve_browser = { cmd = "echo 'Open http://localhost:8000/examples/js/index.html' && python -m http.server 8000", depends-on = ["build_wasm"], description = "Serve repo on :8000 so examples/js/index.html can run corec_test.wasm in a browser" }

[feature.js.dependencies]
nodejs = ">=22"
python = ">=3.10"

#=============================================================================
# Linux
#=============================================================================
[feature.linux.tasks]
build_linux = { cmd = """
clang \
    -nostdlib \
    -nostdinc \
    -fno-builtin \
    -I platform \
    -I . \
    -o corec_test_linux \
    test_base_only.c \
    test_base.c \
    base/io.c \
    base/buddy.c \
    base/arena.c \
    base/scratch.c \
    base/format.c \
    base/math.c \
    base/string.c \
    base/mem.c \
    base/numconv.c \
    base/assert.c \
    base/exit.c \
    platform/platform_linux.c
""", description = "Build corec_test_linux native binary (Linux only)" }

test_linux = { cmd = "./corec_test_linux", depends-on = ["build_linux"], description = "Run corec_test_linux native test binary" }

[feature.linux.target.linux-64.dependencies]
clang = ">=20.1.4,<21"

#=============================================================================
# macOS
#=============================================================================
[feature.macos.tasks]
build_macos = { cmd = """
clang \
    -g \
    -nostdlib \
    -nostdinc \
    -fno-builtin \
    -I platform \
    -I . \
    -o corec_test_macos \
    test_base_only.c \
    test_base.c \
    base/io.c \
    base/buddy.c \
    base/arena.c \
    base/scratch.c \
    base/format.c \
    base/math.c \
    base/string.c \
    base/mem.c \
    base/numconv.c \
    base/assert.c \
    base/exit.c \
    platform/platform_macos.c \
    -lSystem \
    -Wl,-e,__start
""", description = "Build corec_test_macos native binary (macOS only)" }

test_macos = { cmd = "./corec_test_macos", depends-on = ["build_macos"], description = "Run corec_test_macos native test binary" }

#=============================================================================
# Windows
#=============================================================================
[feature.windows.tasks]
build_windows = { cmd = """
cl \
    /nologo \
    /X \
    /std:c11 \
    /Zc:preprocessor \
    /I"platform" \
    /I"." \
    /GS- \
    /Gs0 \
    /kernel \
    /c \
    test_base_only.c \
    test_base.c \
    base/io.c \
    base/buddy.c \
    base/arena.c \
    base/scratch.c \
    base/format.c \
    base/math.c \
    base/string.c \
    base/mem.c \
    base/numconv.c \
    base/assert.c \
    base/exit.c \
    platform/platform_windows.c \
    && \
link \
    /nologo \
    /subsystem:console \
    /nodefaultlib \
    /entry:_start \
    kernel32.lib \
    shell32.lib \
    test_base_only.obj \
    test_base.obj \
    io.obj \
    buddy.obj \
    arena.obj \
    scratch.obj \
    format.obj \
    math.obj \
    string.obj \
    mem.obj \
    numconv.obj \
    exit.obj \
    assert.obj \
    platform_windows.obj \
    /out:corec_test_windows.exe
""", description = "Build corec_test_windows.exe native binary (Windows only; requires MSVC vcvars64)" }

test_windows = { cmd = "./corec_test_windows.exe", depends-on = ["build_windows"], description = "Run corec_test_windows.exe native test binary" }

[feature.windows.target.win-64.dependencies]
# MSVC must be available on PATH (e.g. via vcvars64.bat)

[dependencies]
shell = "*"

[environments]
default = { solve-group = "default" }
wasm = ["wasm"]
js = { features = ["wasm", "js"], solve-group = "js" }
linux = { features = ["linux"], solve-group = "linux" }
macos = { features = ["macos"], solve-group = "macos" }
windows = { features = ["windows"], solve-group = "windows" }
