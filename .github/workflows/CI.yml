name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            pixi-command: |
              export COREC_TEST_ENV=corec_test_value
              printf 'a1\nb2\nc3\n' > expected_args.txt
              pixi run -e linux test_linux a1 b2 c3
              echo "test input data" | pixi run -e linux ./corec_test_linux --test-input
              pixi run -e wasm build_wasm
              pixi run -e wasm wasmtime --dir . --env COREC_TEST_ENV=corec_test_value corec_test.wasm a1 b2 c3
              echo "test input data" | pixi run -e wasm wasmtime --dir . --env COREC_TEST_ENV=corec_test_value corec_test.wasm --test-input
              pixi run -e js test_node a1 b2 c3
              echo "test input data" | pixi run -e js test_node --test-input
          - platform: macos
            os: macos-latest
            pixi-command: |
              export COREC_TEST_ENV=corec_test_value
              printf 'a1\nb2\nc3\n' > expected_args.txt
              pixi run -e macos test_macos a1 b2 c3
              echo "test input data" | pixi run -e macos ./corec_test_macos --test-input
              pixi run -e wasm build_wasm
              pixi run -e wasm wasmtime --dir . --env COREC_TEST_ENV=corec_test_value corec_test.wasm a1 b2 c3
              echo "test input data" | pixi run -e wasm wasmtime --dir . --env COREC_TEST_ENV=corec_test_value corec_test.wasm --test-input
              pixi run -e js test_node a1 b2 c3
              echo "test input data" | pixi run -e js test_node --test-input
          - platform: windows
            os: windows-latest
            pixi-command: |
              call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
              set COREC_TEST_ENV=corec_test_value
              pixi run shell -c "printf 'a1\nb2\nc3\n' > expected_args.txt" || exit /b 1
              pixi run -e windows test_windows a1 b2 c3 || exit /b 1
              pixi run shell -c "printf 'test input data' | pixi run -e windows ./corec_test_windows.exe --test-input" || exit /b 1
              pixi run -e wasm build_wasm || exit /b 1
              pixi run -e wasm wasmtime --dir . --env COREC_TEST_ENV=corec_test_value corec_test.wasm a1 b2 c3 || exit /b 1
              pixi run shell -c "printf 'test input data' | pixi run -e wasm wasmtime --dir . --env COREC_TEST_ENV=corec_test_value corec_test.wasm --test-input" || exit /b 1
              pixi run -e js test_node a1 b2 c3 || exit /b 1
              pixi run shell -c "printf 'test input data' | pixi run -e js test_node --test-input" || exit /b 1

    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.65.0
          cache: true

      - name: Build and test ${{ matrix.platform }}
        if: matrix.platform != 'windows'
        run: ${{ matrix.pixi-command }}

      - name: Build and test ${{ matrix.platform }}
        if: matrix.platform == 'windows'
        run: ${{ matrix.pixi-command }}
        shell: cmd
